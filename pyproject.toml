[project]
name = "google-docs-mcp"
version = "0.1.0"
description = "FastMCP server for Google Docs (content editing) and Google Drive (file lifecycle) — real Docs API v1 batchUpdate + Drive API v3 operations behind a portmanteau tool surface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sandra Schipal" }]
keywords = ["mcp", "google-docs", "google-drive", "fastmcp", "oauth"]

dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "google-api-python-client>=2.149.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "httpx>=0.28.0",
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
google-docs-mcp = "google_docs_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.0",
    "respx>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_docs_mcp"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["mcpb/src", ".venv", "webapp", "native"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
